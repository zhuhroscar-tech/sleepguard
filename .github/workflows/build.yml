name: build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      # actions/checkout v4 pinned to the immutable commit for tag v4 (v4.4.0),
      # resolved via the GitHub API rather than trusting a mutable tag name.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Toolchain
        run: swift --version

      - name: Lint (strict, includes Package.swift)
        run: xcrun swift-format lint --recursive --strict Sources Package.swift

      - name: Tests (unit only)
        run: swift run sleepguard-tests

      - name: Tests (including live IOKit reads)
        env:
          RUN_LIVE_TESTS: "1"
        run: swift run sleepguard-tests

      - name: Release build (warnings as errors)
        run: swift build -c release -Xswiftc -warnings-as-errors

      - name: Run the built binary
        # Allowlist, not denylist: only 0 (provably unblocked), 2 (incomplete)
        # and 3 (confirmed blocked) are successful runs. Anything else — 1 (IOKit
        # read failure), 126/127 (not executable / missing binary), 132-139
        # (SIGILL/SIGABRT/SIGSEGV runtime traps) — must fail the job.
        run: |
          set +e
          ./.build/release/sleepguard
          status=$?
          set -e
          echo "sleepguard exited with $status"
          case "$status" in
            0|2|3) ;;
            *) echo "unexpected exit status $status"; exit 1 ;;
          esac

      - name: Package the menu-bar app and verify the artifact
        # Verifies the bundle it would actually distribute: plist validity,
        # declared version, the executable named by CFBundleExecutable (read
        # from the built plist, never hardcoded), architecture, and signature.
        # The signature is ad-hoc; this step deliberately asserts that it is NOT
        # a Developer ID signature so a notarization claim cannot creep in.
        run: |
          bash scripts/build_app.sh
          APP="dist/SleepGuard.app"
          plutil -lint "$APP/Contents/Info.plist"
          EXEC=$(plutil -extract CFBundleExecutable raw "$APP/Contents/Info.plist")
          echo "declared executable: $EXEC"
          test -x "$APP/Contents/MacOS/$EXEC"
          file "$APP/Contents/MacOS/$EXEC"
          test "$(plutil -extract LSUIElement raw "$APP/Contents/Info.plist")" = "true"
          codesign --verify --deep --strict "$APP"
          if codesign -dv "$APP" 2>&1 | grep -q "Authority=Developer ID"; then
            echo "unexpected Developer ID signature; this project claims ad-hoc only"
            exit 1
          fi

      - name: Verify the extracted archive, not just the pre-archive bundle
        run: |
          cd dist
          ditto -c -k --keepParent SleepGuard.app SleepGuard.zip
          mkdir -p extracted
          ditto -x -k SleepGuard.zip extracted
          APP="extracted/SleepGuard.app"
          plutil -lint "$APP/Contents/Info.plist"
          EXEC=$(plutil -extract CFBundleExecutable raw "$APP/Contents/Info.plist")
          test -x "$APP/Contents/MacOS/$EXEC"
          plutil -extract CFBundleShortVersionString raw "$APP/Contents/Info.plist"
          codesign --verify --deep --strict "$APP"
          echo "extracted archive verified"
